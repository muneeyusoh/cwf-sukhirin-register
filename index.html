<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสมาชิกกองทุนสวัสดิการชุมชน</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --fintech-primary: #0A2540; --fintech-accent: #3B82F6; --bg-light: #F8FAFC; }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; }
    .app-header { background: linear-gradient(135deg, var(--fintech-primary), #1e3a8a); color: white; padding: 40px 20px 60px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(10,37,64,0.2); }
    .card-box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 500px; margin: -45px auto 30px; position: relative; border: 1px solid #E2E8F0; }
    .profile-img { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 4px solid white; margin-top: -65px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .stat-card { background: #F8FAFC; border-radius: 14px; padding: 15px; border: 1px solid #E2E8F0; text-align: center; }
    .badge-status { padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .action-button { background: white; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px 10px; text-align: center; text-decoration: none; color: #1E293B; display: block; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .cwf-card { background: linear-gradient(135deg, #F59E0B, #EA580C); border-radius: 16px; padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    #systemLoading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

<div id="systemLoading"><div class="spinner-border mb-3 text-primary" style="width: 3rem; height: 3rem;" role="status"></div><p class="fw-bold">กำลังเชื่อมต่อข้อมูล...</p></div>

<div class="app-header">
  <h4 class="fw-bold mb-1">กองทุนสวัสดิการชุมชน</h4>
  <p class="opacity-75 small mb-0">เทศบาลตำบลสุคิริน</p>
</div>

<div class="container mb-5">
  
  <!-- 📝 Register View -->
  <div id="registerView" class="card-box" style="display: none;">
    <h5 class="mb-4 text-center fw-bold"><i class="fa-solid fa-user-plus text-primary me-2"></i>ลงทะเบียนสมาชิก</h5>
    <form onsubmit="handleRegister(event)">
      <input type="hidden" name="action" value="register">
      <input type="hidden" id="uid" name="uid">
      <input type="hidden" id="refCode" name="refCode">
      <input type="text" class="form-control mb-3" name="fullName" placeholder="ชื่อ-นามสกุล" required>
      <input type="tel" class="form-control mb-3" name="nationalId" placeholder="เลขบัตร ปชช. 13 หลัก" maxlength="13" required>
      <input type="tel" class="form-control mb-3" name="phone" placeholder="เบอร์โทรศัพท์" maxlength="10" required>
      <select class="form-select mb-4" name="center" required>
        <option value="" disabled selected>-- เลือกศูนย์ประสานงาน --</option>
        <option value="ศูนย์บ้านจารังตาดง">บ้านจารังตาดง</option><option value="ศูนย์ชุมชนเกียร์">ชุมชนเกียร์</option>
        <option value="ศูนย์ชุมชนมาโมง">ชุมชนมาโมง</option><option value="ศูนย์ชุมชนสุคิริน">ชุมชนสุคิริน</option>
      </select>
      <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-4">ยืนยันการลงทะเบียน</button>
    </form>
  </div>

  <!-- 📊 Dashboard View -->
  <div id="dashboardView" class="card-box text-center" style="display: none;">
    <img id="userAvatar" src="" class="profile-img">
    <h4 id="dashName" class="fw-bold mt-2 mb-0"></h4>
    <p id="dashCenter" class="text-muted small mb-2"><i class="fa-solid fa-location-dot text-danger"></i> <span id="dashCenterText"></span></p>
    <div id="dashStatusBadge" class="badge-status bg-warning text-dark d-inline-block mb-4"></div>
    
    <div class="cwf-card text-start">
      <div><small class="opacity-75 d-block">คะแนนสะสมอาสาสมัคร</small><h3 class="fw-bold mb-0"><span id="dashCwfPoints">0</span> CWF</h3></div>
      <button onclick="shareRefLink()" class="btn btn-light btn-sm fw-bold text-warning rounded-pill"><i class="fa-solid fa-share-nodes"></i> ชวนเพื่อน</button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6"><a href="https://liff.line.me/2010764982-BltKP85l" class="action-button"><i class="fa-solid fa-coins fa-2x text-success mb-2"></i><b>สมทบเงิน</b></a></div>
      <div class="col-6"><a href="https://liff.line.me/2010764982-opxguAid" class="action-button"><i class="fa-solid fa-hand-holding-heart fa-2x text-warning mb-2"></i><b>ขอรับสวัสดิการ</b></a></div>
    </div>
    
    <div class="text-start border-top pt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold m-0 text-primary">ข้อมูลส่วนตัว</h6>
        <button onclick="editProfileModal()" class="btn btn-sm btn-outline-secondary rounded-pill" style="font-size:0.75rem;"><i class="fa-solid fa-pen"></i> แก้ไข</button>
      </div>
      <div class="bg-light p-3 rounded-4 small mb-4 border">
        <div class="d-flex justify-content-between mb-2"><span class="text-muted">รหัสสมาชิก:</span><span id="dashAppId" class="fw-bold text-primary"></span></div>
        <div class="d-flex justify-content-between mb-2"><span class="text-muted">เบอร์โทรศัพท์:</span><span id="dashPhone" class="fw-bold text-dark"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
  const LIFF_ID = "2010764982-RCKkyPZG"; 
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw8ohbEXMSqCKzwTHeCem8pxpM_NcSA_twE3r4QU1HvsNZjtlEydGMoV6ffP1yBUOk/exec"; 

  document.addEventListener("DOMContentLoaded", async () => {
    await liff.init({ liffId: LIFF_ID });
    if(new URLSearchParams(window.location.search).get('ref')) document.getElementById('refCode').value = new URLSearchParams(window.location.search).get('ref');
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile(); document.getElementById('uid').value = profile.userId;
      checkMemberStatus(profile.userId, profile.pictureUrl || "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/icons/person-circle.svg");
    } else liff.login();
  });

  async function checkMemberStatus(uid, pic) {
    try {
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "checkStatus", uid: uid }) }).then(r=>r.json());
      document.getElementById('systemLoading').style.display = 'none';
      if (res.status === 'registered') {
        const d = res.memberData;
        document.getElementById('userAvatar').src = pic; document.getElementById('dashName').innerText = d.fullName;
        document.getElementById('dashCenterText').innerText = d.center; document.getElementById('dashCwfPoints').innerText = d.cwfPoints;
        document.getElementById('dashStatusBadge').innerText = d.status;
        document.getElementById('dashStatusBadge').className = d.status.includes('สมาชิก') ? "badge-status bg-success text-white d-inline-block mb-4" : "badge-status bg-warning text-dark d-inline-block mb-4";
        document.getElementById('dashAppId').innerText = d.memberId; document.getElementById('dashPhone').innerText = d.phone;
        document.getElementById('dashboardView').style.display = 'block';
      } else document.getElementById('registerView').style.display = 'block';
    } catch(e) { document.getElementById('systemLoading').style.display = 'none'; document.getElementById('registerView').style.display = 'block'; }
  }

  async function handleRegister(e) {
    e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true; btn.innerText = 'กำลังบันทึก...';
    try {
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) }).then(r=>r.json());
      if(res.status==='success') Swal.fire('สำเร็จ', res.message, 'success').then(()=>location.reload()); else { Swal.fire('แจ้งเตือน', res.message, 'warning'); btn.disabled=false; btn.innerText='ยืนยัน'; }
    } catch(err) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อได้', 'error'); btn.disabled=false; }
  }

  function editProfileModal() {
    const currentPhone = document.getElementById('dashPhone').innerText;
    Swal.fire({
      title: 'แก้ไขข้อมูลส่วนตัว', html: `<input id="editPhone" type="tel" class="form-control text-center fw-bold" value="${currentPhone}" maxlength="10" placeholder="เบอร์โทรศัพท์ใหม่">`,
      showCancelButton: true, confirmButtonText: 'บันทึกการแก้ไข', confirmButtonColor: '#3B82F6',
      preConfirm: () => {
        const p = document.getElementById('editPhone').value; if(p.length < 9) return Swal.showValidationMessage('กรุณาระบุเบอร์โทรให้ถูกต้อง');
        return { action: 'updateProfile', uid: document.getElementById('uid').value, phone: p };
      }
    }).then(async (res) => {
      if(res.isConfirmed) {
        document.getElementById('systemLoading').style.display = 'flex';
        await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(res.value) }); location.reload();
      }
    });
  }

  function shareRefLink() {
    const url = `https://liff.line.me/${LIFF_ID}?ref=${document.getElementById('dashAppId').innerText}`;
    navigator.clipboard.writeText(url); Swal.fire('คัดลอกลิงก์สำเร็จ!', 'ส่งให้เพื่อนสมัครได้เลยครับ', 'success');
  }
</script>
</body>
</html>
